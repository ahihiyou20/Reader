# Weekly Firestore export, encrypted and kept as a workflow artifact for 90 days (never committed).
# The repo is public, so any signed-in GitHub user can download its artifacts: the export is
# encrypted with the BACKUP_PASSPHRASE secret and the job fails rather than upload plain data.
# Restore: gpg -d firestore-backup.tar.gz.gpg | tar -xz
name: Backup
on:
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Require the encryption passphrase
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_PASSPHRASE secret. Backups are never uploaded unencrypted."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/pipeline/backup.ts "$RUNNER_TEMP/backup"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p encrypted
          tar -C "$RUNNER_TEMP" -czf - backup \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
                -o encrypted/firestore-backup.tar.gz.gpg 3<<< "$PASSPHRASE"
          rm -rf "$RUNNER_TEMP/backup"
      - uses: actions/upload-artifact@v4
        with: { name: firestore-backup, path: encrypted/firestore-backup.tar.gz.gpg, retention-days: 90 }
