# Daily articles (docs/05 §9): topics from content/feeds.json (and Gemini's topic ideas when the feeds
# fall short), each researched and written as Reader's own article of 1,000+ words in five languages
# with an Unsplash cover. At least 20 a day, no upper limit. The articles wait in one rolling pull
# request from bot/new-articles until it is merged, or go straight to main when the repository variable
# FEEDS_AUTO_PUBLISH is "true".
# Needs the secrets GEMINI_API_KEY and UNSPLASH_ACCESS_KEY (FIRECRAWL_API_KEY optional), and for the pull
# request Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Daily articles
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      min: { description: 'Keep writing until at least this many articles (feeds, then topic ideas)', required: false, default: '20' }
      limit: { description: 'Most articles in this run (0: no limit)', required: false, default: '0' }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: content-bot
  cancel-in-progress: false
env:
  BRANCH: bot/new-articles
  AUTO_PUBLISH: ${{ vars.FEEDS_AUTO_PUBLISH == 'true' }}
jobs:
  feeds:
    runs-on: ubuntu-latest
    # Each article is researched, written and translated into four languages: about 3 minutes of
    # Gemini time each, three at a time. The script stops starting new ones after --minutes.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare the bot branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          state=content/generated/feed-state.json
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            # Links the bot has already looked at, even if their pull request was closed.
            git show "origin/$BRANCH:$state" > "$RUNNER_TEMP/state.json" 2>/dev/null || true
            if [ -n "$pr" ] && [ "$AUTO_PUBLISH" != "true" ]; then
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git merge --no-edit origin/main || { git merge --abort; git checkout -B "$BRANCH" origin/main; }
            else
              git checkout -B "$BRANCH" origin/main
            fi
          else
            git checkout -B "$BRANCH" origin/main
          fi
          if [ -s "$RUNNER_TEMP/state.json" ]; then
            node -e '
              const fs = require("fs");
              const [a, b] = process.argv.slice(1).map((f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).seen || {}; } catch { return {}; } });
              fs.mkdirSync("content/generated", { recursive: true });
              fs.writeFileSync(process.argv[2], JSON.stringify({ seen: { ...a, ...b } }, null, 2) + "\n");
            ' "$RUNNER_TEMP/state.json" "$state"
          fi
      - name: Write articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PER_RUN: ${{ vars.FIRECRAWL_MAX_PER_RUN }}
          SITE_URL: ${{ vars.SITE_URL }}
          MIN: ${{ inputs.min || '20' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: pnpm tsx scripts/pipeline/feeds.ts --min "$MIN" --limit "$LIMIT" --minutes 170 --jobs 3 --report "$RUNNER_TEMP/report.md"
      - name: Check
        run: pnpm tsx scripts/pipeline/validate.ts
      - name: Commit and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.branch.outputs.pr }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          git add content
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "content: daily articles $(date -u +%F)"
          if [ "$AUTO_PUBLISH" = "true" ]; then
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
            # Pushes made with GITHUB_TOKEN start no push runs, so ask for the deploy explicitly.
            gh workflow run deploy.yml --ref main
            exit 0
          fi
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$(git diff --name-only --diff-filter=A origin/main...HEAD -- content/articles)" ]; then
            echo "Only the feed state changed."; exit 0
          fi
          pnpm -s tsx scripts/pipeline/pr-body.ts origin/main > "$RUNNER_TEMP/body.md"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Bài mới từ nguồn tự động" --body-file "$RUNNER_TEMP/body.md" \
              || echo "::warning::Could not open the pull request. Enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
          fi
          # Pushes made with GITHUB_TOKEN start no pull_request runs, so ask for the checks explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
