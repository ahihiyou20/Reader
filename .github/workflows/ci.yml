# Code checks on pull requests and pushes that touch code. The bot's own pull requests do not start
# pull_request runs (events made with GITHUB_TOKEN never do), so feeds.yml dispatches this workflow.
name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which Playwright 1.56 (--with-deps) does not support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Security Rules (Firestore emulator)
        run: pnpm test:rules
      - name: Build
        run: pnpm build
      # Frame timing needs a GPU; hosted runners have none, so it is measured on real hardware
      # (tests/qa/edge-perf.mjs) instead.
      - name: End-to-end (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e --grep-invert "frame intervals p95"
      - uses: actions/upload-artifact@v6
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
