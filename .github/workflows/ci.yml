# Code checks on pull requests and pushes that touch code. The bot's own pull requests do not start
# pull_request runs (events made with GITHUB_TOKEN never do), so gemini-writer.yml dispatches this workflow.
name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Timing, motion and screenshot checks: run in the advisory step, never block.
  POLISH: 'frame continuity|Motion Quality|visual screenshots|census|stagger|rotation tests|decode fade|hover: fine pointer|count roll|indicator:|popover:|modal sheet|toast:|comment: newly|checklist:|interruptible'
jobs:
  test:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which Playwright 1.56 (--with-deps) does not support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Security Rules (Firestore emulator)
        run: pnpm test:rules
      - name: Build
        id: build
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # What blocks a merge: the app works (navigation, reading, sign-in, layout, loading).
      - name: End-to-end (Playwright)
        run: pnpm test:e2e --project iphone --project qa --project continuity --grep-invert "$POLISH"
      # Frame timing, motion curves and pixel screenshots depend on the runner's CPU and fonts: reported, never blocking.
      # The p95 frame interval needs a GPU and is measured on real hardware (tests/qa/edge-perf.mjs).
      - name: Motion and visual checks (advisory)
        id: advisory
        if: (success() || failure()) && steps.build.outcome == 'success'
        continue-on-error: true
        run: pnpm test:e2e --project qa --project continuity --grep "$POLISH"
      - uses: actions/upload-artifact@v6
        if: failure() || steps.advisory.outcome == 'failure'
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
