# Step 10: posts from the + button become review drafts; authors see the outcome in Profile.
name: Submissions
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}  # one run per job; a push that meets a moved main rebases and retries
  cancel-in-progress: false
jobs:
  submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/pipeline/submissions.ts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit drafts
        run: |
          git config user.name "reader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          git diff --cached --quiet || (git commit -m "pipeline: reader submissions" && { n=0; until git pull --rebase -q origin main && git push; do n=$((n + 1)); [ $n -lt 4 ] || exit 1; sleep $((n * 10)); done; })
