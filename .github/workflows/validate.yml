# Step 7: check content after every CMS save and keep the "Content checks" issue up to date.
name: Validate content
on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: validate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/pipeline/validate.ts --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
