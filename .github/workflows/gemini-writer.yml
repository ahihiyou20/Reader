# Gemini writer (docs/05 step 11): every day, topics from content/feeds.json, plus Gemini's topic ideas
# when the feeds fall short, are researched (the page, Wikipedia, Europe PMC, Firecrawl) and written as
# Pagemoor's own articles of 1,000+ words, with highlights and source chips in every section, all five
# languages with glossaries, an Unsplash cover in portrait and landscape, and a motion cover cut from a
# Pixabay video (set the variable GEMINI_MOTION_COVERS to "false" to skip those). At least 20 a day,
# no upper limit.
# The articles wait in one rolling pull request from bot/new-articles until it is merged (merging starts
# finish-articles.yml), or go straight to main when the variable GEMINI_AUTO_PUBLISH is "true".
# Secrets: GEMINI_API_KEY, UNSPLASH_ACCESS_KEY, PIXABAY_API_KEY, CLOUDINARY_URL (FIRECRAWL_API_KEY
# optional). Variables
# (optional): GEMINI_MODEL, GEMINI_FALLBACK_MODELS, FIRECRAWL_MAX_PER_RUN. The pull request needs
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Gemini writer
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      min: { description: 'Keep writing until at least this many articles (feeds, then topic ideas)', required: false, default: '20' }
      limit: { description: 'Most articles in this run (0: no limit)', required: false, default: '0' }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: content-bot
  cancel-in-progress: false
env:
  BRANCH: bot/new-articles
  AUTO_PUBLISH: ${{ vars.GEMINI_AUTO_PUBLISH == 'true' || vars.FEEDS_AUTO_PUBLISH == 'true' }}
  MOTION_COVERS: ${{ vars.GEMINI_MOTION_COVERS != 'false' }}
  # Motion-cover clips go to Cloudinary (scripts/pipeline/cloudinary.ts); without it, into public/covers/video/.
  CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
  CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
jobs:
  write:
    runs-on: ubuntu-latest
    # Each article is researched, written and translated into four languages: about 3 minutes of
    # Gemini time each, three at a time. The script stops starting new ones after --minutes.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (motion covers)
        if: env.MOTION_COVERS == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Prepare the bot branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          state=content/generated/feed-state.json
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            # Links the bot has already looked at, even if their pull request was closed.
            git show "origin/$BRANCH:$state" > "$RUNNER_TEMP/state.json" 2>/dev/null || true
            if [ -n "$pr" ] && [ "$AUTO_PUBLISH" != "true" ]; then
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git merge --no-edit origin/main || { git merge --abort; git checkout -B "$BRANCH" origin/main; }
            else
              git checkout -B "$BRANCH" origin/main
            fi
          else
            git checkout -B "$BRANCH" origin/main
          fi
          if [ -s "$RUNNER_TEMP/state.json" ]; then
            node -e '
              const fs = require("fs");
              const [a, b] = process.argv.slice(1).map((f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).seen || {}; } catch { return {}; } });
              fs.mkdirSync("content/generated", { recursive: true });
              fs.writeFileSync(process.argv[2], JSON.stringify({ seen: { ...a, ...b } }, null, 2) + "\n");
            ' "$RUNNER_TEMP/state.json" "$state"
          fi
      - name: Write articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MAX_PER_RUN: ${{ vars.FIRECRAWL_MAX_PER_RUN }}
          SITE_URL: ${{ vars.SITE_URL }}
          MIN: ${{ inputs.min || '20' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: pnpm tsx scripts/pipeline/feeds.ts --min "$MIN" --limit "$LIMIT" --minutes 170 --jobs 3 --report "$RUNNER_TEMP/report.md"
      - name: Finish this run's articles
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
        run: |
          # A language the quota or an overloaded model cut short gets one more try, then the standard report.
          new=$(git ls-files --others --exclude-standard content/articles | xargs -r -n1 basename | sed 's/\.json$//')
          if [ -z "$new" ]; then echo "No new articles."; exit 0; fi
          pnpm tsx scripts/pipeline/finish.ts $new
      - name: Check
        run: pnpm tsx scripts/pipeline/validate.ts
      - name: Commit and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.branch.outputs.pr }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          git add -A content $(ls -d public/covers/video 2>/dev/null)
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "content: Gemini articles $(date -u +%F)"
          if [ "$AUTO_PUBLISH" = "true" ]; then
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
            # Pushes made with GITHUB_TOKEN start no push runs, so ask for the deploy explicitly.
            gh workflow run deploy.yml --ref main
            exit 0
          fi
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$(git diff --name-only --diff-filter=A origin/main...HEAD -- content/articles)" ]; then
            echo "Only the feed state changed."; exit 0
          fi
          pnpm -s tsx scripts/pipeline/pr-body.ts origin/main > "$RUNNER_TEMP/body.md"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "Bài mới từ Gemini writer" --body-file "$RUNNER_TEMP/body.md" \
              || echo "::warning::Could not open the pull request. Enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
          fi
          # Pushes made with GITHUB_TOKEN start no pull_request runs, so ask for the checks explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
